name: Build Foundation paper PDF
on:
  push:
    branches: [main]
    paths:
      - "Topics/Foundation/paper/main.tex"
      - "Topics/Foundation/paper/references.tex"
      - ".github/workflows/build-foundation-paper.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-latex-recommended
      - name: Compile PDF
        working-directory: Topics/Foundation/paper
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references" build/compile.log 2>/dev/null; then exit 1; fi
      - name: Regenerate manuscript navigation
        working-directory: Topics/Foundation/paper
        run: |
          python3 build/rebuild_navigation.py
      - name: Commit resulting PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Topics/Foundation/paper/main.pdf Topics/Foundation/paper/docs/scope_89.csv Topics/Foundation/paper/docs/scope_89.md Topics/Foundation/paper/docs/25_MAIN_RESULTS_CROSSWALK.md Topics/Foundation/paper/docs/MAIN_TEXT_SUBSECTION_MAP.md Topics/Foundation/paper/docs/MAIN_RESULT_PROOF_CHAINS.md Topics/Foundation/paper/docs/REPO_FILE_MANIFEST_SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m 'docs(foundation): rebuild manuscript PDF'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
